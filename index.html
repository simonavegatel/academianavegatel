<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academia Navegatel - Landing Page</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <!-- Cabecera -->
    <header class="py-3">
        <div class="container position-relative">
            <!-- Elemento Decorativo -->
            <div class="decoracion-semicirculo"></div>

            <div class="row align-items-center">
                <div class="col-md-6">
                    <img src="../logo horizontal.svg" alt="Logo Academia Navegatel" class="img-fluid logo-cabecera">
                </div>
                <div class="col-md-6 text-end">
                    <a href="#contacto" class="btn boton-contacto">CONTACTAR</a>
                </div>
            </div>
        </div>
    </header>

    <!-- Sección Hero -->
    <section id="inicio" class="hero py-5 w-full">
        <div class="container">
            <div class="row justify-between align-items-center">
                <div class="col-lg-6 mb-5 mb-lg-0">
                    <h1 class="display-3 fw-bold text-dark lh-sm">
                        Gestiona tu academia desde un solo lugar.
                    </h1>
                    <div class="separador-rojo"></div>
                    <p class="lead w-75 text-dark mb-5">La plataforma completa para gestionar clases,
                        alumnos, reservas y comunicación. Todo lo que necesitas para hacer crecer tu academia.</p>
                </div>
                <div class="col-lg-6 position-relative">
                    <div class="hero-contenedor-imagen">
                        <!-- Forma de fondo oscura -->
                        <div class="hero-forma-fondo"></div>

                        <!-- Imagen Principal -->
                        <div class="hero-contenedor-foto">
                            <img src="../imagen.webp" alt="Estudiante contenta" class="img-fluid">
                        </div>

                        <!-- Círculo Rojo Decorativo -->
                        <div class="hero-decoracion-circulo-rojo"></div>

                        <!-- Icono de Flecha -->
                        <div class="hero-icono-flecha">
                            <img src="../flecha.svg" alt="Ir">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>



    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- JS Personalizado -->
    <script src="script.js"></script>
</body>

</html>
