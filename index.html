<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academia Navegatel - Landing Page</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <!-- Header -->
    <header class="py-3">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-md-6">
                    <img src="../logo horizontal.svg" alt="Logo Academia Navegatel" class="img-fluid header-logo">
                </div>
                <div class="col-md-6 text-end">
                    <a href="#contacto" class="btn btn-contact">CONTACTAR</a>
                </div>
            </div>
        </div>
    </header>

    <!-- Hero Section -->
    <section id="inicio" class="hero py-5 w-full">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-md-6">
                    <h1 class="display-3 fw-bold text-dark">Gestiona tu academia desde un solo lugar.</h1>
                    <div class="h-0.5 w-1/2 my-10" style="background-color: #d8001d;"></div>
                    <p class="lead text-dark">La plataforma completa para gestionar clases, alumnos, reservas y comunicación. Todo lo que necesitas para hacer crecer tu academia.</p>
                </div>
                <div class="col-md-6">
                    <div class="image-container">
                        <img src="../imagen.webp" alt="Imagen Hero" class="img-fluid rounded-circle">
                    </div>
                </div>
            </div>
        </div>
    </section>

  

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="script.js"></script>
</body>

</html>
